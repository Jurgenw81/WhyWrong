[project]
name = "whywrong"
version = "0.1.0"
description = "AI learning debugger that diagnoses misconceptions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

